/*
 * Forge removes @SideOnly(Side.CLIENT) classes, fields and methods from the dedicated server.
 * A field of the common AudioWrapper type is still referenced by common tile entity code
 * (onChunkUnload/invalidate), so annotating it breaks the server with NoSuchFieldError.
 * Fail the build instead of shipping such a jar.
 */
tasks.register('checkAudioWrapperSideOnly') {
    group = 'verification'
    description = 'Rejects @SideOnly(Side.CLIENT) on AudioWrapper fields, which are stripped on the dedicated server'

    def sourceFiles = fileTree('src/main/java') {
        include '**/*.java'
        exclude '**/BuildInfo.java' // generated by the build, not an input of this check
    }
    inputs.files(sourceFiles)

    doLast {
        def annotationPattern = ~/(?s)@SideOnly\s*\(\s*(?:value\s*=\s*)?(?:[A-Za-z0-9_.]+\.)?Side\.CLIENT\s*\)\s*(?:@[A-Za-z0-9_.]+(?:\([^)]*\))?\s*)*([^;{}]*?)([;{}])/
        def audioTypePattern = ~/\b(?:com\.hbm\.sound\.)?AudioWrapper(?:Client|ClientStartStop)?\b/
        def violations = []

        sourceFiles.each { File file ->
            def text = file.getText('UTF-8')
            def matcher = annotationPattern.matcher(text)

            while (matcher.find()) {
                if (matcher.group(2) != ';' || matcher.group(1).contains('(')) continue
                if (!audioTypePattern.matcher(matcher.group(1)).find()) continue

                def line = text.substring(0, matcher.start()).count('\n') + 1
                def relativePath = project.projectDir.toPath().relativize(file.absoluteFile.toPath())
                violations << "${relativePath}:${line}: ${matcher.group(1).trim()}"
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    '@SideOnly(Side.CLIENT) must not be used on AudioWrapper fields. ' +
                    'Forge strips those fields on the dedicated server, while common tile entity code ' +
                    'still references them (NoSuchFieldError). Remove the annotation from the field.\n' +
                    violations.join('\n')
            )
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('checkAudioWrapperSideOnly')
}

tasks.named('test').configure {
    systemProperty 'hbm.mainClassesDir', sourceSets.main.output.classesDirs.singleFile.absolutePath
}

/*
 * Full dedicated-server smoke test. Starts the same JVM/classpath that :runServer uses,
 * waits for "Done (", sends "stop", and checks the log for AudioWrapper linkage errors.
 * Kept out of the normal :check task because it boots a complete Minecraft server.
 */
tasks.register('serverSmokeTest') {
    group = 'verification'
    description = 'Boots a dedicated server, stops it cleanly and checks for AudioWrapper linkage errors'

    dependsOn {
        tasks.named('runServer').get().dependsOn
    }

    doLast {
        def runServerTask = tasks.named('runServer').get()
        def workDir = new File(project.buildDir, 'server-smoke')
        project.delete(workDir)
        if (!workDir.mkdirs()) {
            throw new GradleException("Could not create ${workDir}")
        }

        def socket = new java.net.ServerSocket(0)
        int port = socket.localPort
        socket.close()

        new File(workDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(workDir, 'server.properties').setText("""\
online-mode=false
level-name=smoke-world
level-type=FLAT
generate-structures=false
spawn-npcs=false
spawn-animals=false
spawn-monsters=false
allow-nether=false
server-port=${port}
server-ip=127.0.0.1
max-tick-time=-1
motd=HBM server smoke test
""".stripIndent(), 'UTF-8')

        def command = [
                runServerTask.javaLauncher.get().executablePath.asFile.absolutePath,
                '-Dfml.coreMods.load=com.hbm.core.HbmCorePlugin',
                '-Dfml.ignoreInvalidMinecraftCertificates=true',
                '-Dterminal.jline=true',
                '-Dforge.verboseMissingModelLoggingCount=1000000',
                '-ea:com.hbm',
                '-Xms512M',
                '-Xmx2G',
                '-Dfile.encoding=UTF-8',
                '-cp', runServerTask.classpath.asPath,
                runServerTask.mainClass.get(),
                'nogui'
        ]

        logger.lifecycle("Starting dedicated server smoke test on 127.0.0.1:${port}")
        def process = new ProcessBuilder(command)
                .directory(workDir)
                .redirectErrorStream(true)
                .start()

        def logFile = new File(workDir, 'server.log')
        def started = new java.util.concurrent.atomic.AtomicBoolean(false)
        def reader = Thread.start {
            logFile.withWriter('UTF-8') { writer ->
                process.inputStream.withReader('UTF-8') { stream ->
                    stream.eachLine { line ->
                        writer.write(line)
                        writer.newLine()
                        if (line.contains('Done (')) {
                            started.set(true)
                            process.outputStream.write('stop\n'.getBytes('UTF-8'))
                            process.outputStream.flush()
                        }
                    }
                }
            }
        }

        boolean finished = process.waitFor(5, java.util.concurrent.TimeUnit.MINUTES)
        if (!finished) {
            process.destroyForcibly()
        }
        reader.join(30_000)

        def log = logFile.getText('UTF-8')
        if (!finished) {
            throw new GradleException("Server did not stop within 5 minutes. Log: ${logFile}")
        }
        if (!started.get()) {
            throw new GradleException("Server never reached the 'Done (' state. Log: ${logFile}")
        }
        if (process.exitValue() != 0) {
            throw new GradleException("Server exited with code ${process.exitValue()}. Log: ${logFile}")
        }

        def linkageErrors = [
                'NoSuchFieldError: audio',
                'NoClassDefFoundError: com/hbm/sound/AudioWrapper',
                'NoClassDefFoundError: com.hbm.sound.AudioWrapper'
        ].findAll { log.contains(it) }

        if (!linkageErrors.isEmpty()) {
            throw new GradleException("AudioWrapper linkage errors found in server log ${logFile}: ${linkageErrors}")
        }

        logger.lifecycle("Dedicated server smoke test passed. Log: ${logFile}")
    }
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs the fast AudioWrapper checks and the dedicated-server smoke test'
    dependsOn tasks.named('test'), tasks.named('serverSmokeTest')
}

// Standard `check`/`build` runs now include the dedicated-server smoke test as well.
tasks.named('check').configure {
    dependsOn tasks.named('serverSmokeTest')
}
