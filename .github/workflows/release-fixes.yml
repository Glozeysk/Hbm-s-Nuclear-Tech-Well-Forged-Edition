name: ReleaseFixes

on:
  push:
    branches: [ ReleaseFixes ]
  pull_request:
    branches: [ ReleaseFixes ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify build, AudioWrapper tests and dedicated server
        run: ./gradlew check --console=plain --stacktrace
